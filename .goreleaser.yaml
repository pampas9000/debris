# .goreleaser.yaml
# More info at: https://goreleaser.com/config/
version: 2

project_name: debris

before:
  hooks:
    - go mod tidy

builds:
  - id: debris
    main: .
    binary: debris
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X debris/cmd.Version={{.Version}}
      - -X debris/cmd.Commit={{.ShortCommit}}
      - -X debris/cmd.Date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - ids: [debris]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: ["zip"]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  disable: false
  draft: true # 发布为草稿，方便审核后手动点击 Publish；如需直接发布可改为 false
  prerelease: auto
  github:
    owner: pampas9000
    name: debris
